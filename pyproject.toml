[build-system]
# 77 is the first release to accept an SPDX string for `license`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-taxi-demand-forecast"
# Read from ML_Pipeline.__version__, the one place the version is written.
dynamic = ["version"]
description = "Demand forecasting for bike-taxi ride requests"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

# The real dependency set, previously absent: `pip install .` produced a package
# that imported nothing, because the pins lived only in requirements.txt where
# no packaging tool looks for them.
#
# Bounds are two-sided. Lower bounds alone (`pandas>=1.3.0`) span several
# releases with breaking changes, so a fresh install could silently resolve to a
# version the code was never run against.
#
# Verified green on Python 3.10-3.13 in CI against pandas 2.3.3, numpy 2.2-2.5,
# scikit-learn 1.7-1.9, xgboost 3.2-3.4.
dependencies = [
    # pandas 3.0 changes copy-on-write and several groupby/resample defaults.
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    # xgboost 2.0 moved early_stopping_rounds to the constructor; 4.0 may move again.
    "xgboost>=2.0,<4.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
# The dashboard is the only thing that needs a plotting stack at import time.
dashboard = [
    "streamlit>=1.30,<2.0",
    "matplotlib>=3.7,<4.0",
]
# ModelEvaluator.plot_residuals imports these lazily, inside the function, so
# the core package does not require them.
plots = [
    "matplotlib>=3.7,<4.0",
    "scipy>=1.10,<2.0",
]
# The forecast API. Kept out of the core so the pipeline installs without a web
# stack: training and serving have genuinely different dependency needs.
serving = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.27,<1.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "ruff>=0.4,<1.0",
    # fastapi.testclient needs httpx; without it the API tests cannot run.
    "httpx>=0.24,<1.0",
    # Karnataka holiday calendar for experiments/measure_weather.py. Not a pipeline
    # dependency: the experiment found holidays not worth adding as a feature.
    "holidays>=0.50,<1.0",
]
# Historical exploratory notebooks; not needed to run the pipeline or the tests.
notebooks = [
    "jupyter>=1.0,<2.0",
    "ipython>=8.0,<10.0",
    "seaborn>=0.12,<1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ML_Pipeline.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# testpaths keeps collection inside tests/. Without it, pytest picked up the
# old root-level test_pipeline.py -- a script that ran a full training job at
# collection time and called sys.exit().
testpaths = ["tests"]
# "." puts the root-level run_pipeline.py on the path so its CLI wiring is
# testable; collection still stays inside tests/ via testpaths above.
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises model fitting; deselect with -m 'not slow'",
]
filterwarnings = [
    "error::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The notebooks are a historical record of the original exploratory analysis,
# not maintained source. They are excluded rather than rewritten, so the lint
# signal reflects the code that is actually maintained.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters by calling Query/Path/Body/Depends in the
# default, which B008 flags as a mutable default. It is the framework's intended
# usage and the objects are immutable descriptors, so they are allowlisted rather
# than worked around.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
]

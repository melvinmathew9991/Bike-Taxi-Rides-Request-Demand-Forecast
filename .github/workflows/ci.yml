name: CI

# The repository had no CI until this workflow. Two defects in the command-line
# layer -- a default path that made the forecasting stage skip on every run, and
# `--config` discarding every other flag -- shipped through a full audit and a
# merged pull request without anything checking them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One red version should not hide the state of the others.
      fail-fast: false
      matrix:
        # The floor and ceiling of `requires-python = ">=3.10"`. Verified green
        # locally on 3.10.11 and 3.13.14 before this workflow was added, so a
        # failure here is a real regression rather than an untested claim.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt includes requirements.txt, so this exercises the
      # runtime pins as well. Installing from the pinned files rather than
      # `pip install -e .` is the point: a bound that resolves to a version the
      # code was never run against is the failure this catches.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Report resolved versions
        run: |
          python -c "import sys, pandas, numpy, sklearn, xgboost; print(sys.version); print('pandas', pandas.__version__); print('numpy', numpy.__version__); print('scikit-learn', sklearn.__version__); print('xgboost', xgboost.__version__)"

      - name: Lint
        run: ruff check .

      # No data is fetched or created anywhere above. The suite builds synthetic
      # data in memory, and this job running on a bare checkout is what holds
      # the README's "a fresh clone can run pytest immediately" to its word --
      # a local run can pass off git-ignored files that a clone will not have.
      - name: Test
        run: pytest

  # The Dockerfile was written without a Docker daemon and never built. This
  # builds it, starts it on a synthetic output directory, and checks the three
  # things a deployment depends on: it becomes ready, it refuses a request
  # without the key, and it serves a forecast with it.
  container:
    runs-on: ubuntu-latest
    env:
      IMAGE: bike-taxi-forecast:ci
      API_KEY: ci-smoke-key
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      # Built inside the image, so the model is pickled by the xgboost that
      # will load it. Run as the runner's user so it can write the mount.
      - name: Build synthetic output directory
        run: |
          mkdir smoke
          docker run --rm -i --user "$(id -u)" -v "$PWD/smoke:/smoke" "$IMAGE" \
            python - /smoke < scripts/build_smoke_output.py

      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e BIKETAXI_API_KEY="$API_KEY" \
            -v "$PWD/smoke:/app/output:ro" "$IMAGE"

      - name: Wait until ready
        run: |
          for i in $(seq 1 45); do
            if curl -fsS localhost:8000/health | grep -q '"ready":true'; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never became ready"; exit 1

      - name: Refuses a request without the key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/forecast?steps=2')
          echo "status $code"; test "$code" = 401

      - name: Serves a forecast with the key
        run: |
          curl -fsS -H "X-API-Key: $API_KEY" 'localhost:8000/forecast?steps=4' \
            | python3 -c "import json, sys; b = json.load(sys.stdin); n = len(b['forecast']); print(b['model_name'], n, 'points'); sys.exit(0 if n == 12 else 1)"

      - name: Container logs
        if: always()
        run: docker logs api || true
